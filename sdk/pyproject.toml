[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "passport-os-sdk"
version = "0.1.0"
description = "Passport OS package, simulator and device development tools"
requires-python = ">=3.10"
dependencies = ["pyserial==3.5"]
[project.scripts]
passport = "passport.cli:main"
[tool.setuptools]
packages = ["passport"]
[tool.setuptools.package-data]
passport = ["*.json"]

[project.optional-dependencies]
assets = ["Pillow==11.3.0", "CairoSVG==2.8.2"]

[tool.setuptools.cmdclass]
build_py = "build_support.BuildPy"
