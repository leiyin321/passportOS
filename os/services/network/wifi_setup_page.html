<!doctype html><html><meta charset=utf-8><meta name=viewport content='width=device-width'><title>Passport Wi-Fi</title>
<style>body{font:17px system-ui;max-width:32em;margin:2em auto;padding:0 1em;background:#101827;color:#eef}input,textarea,button,select{font:inherit;padding:.7em;margin:.4em 0;width:100%;box-sizing:border-box}button{background:#42c5d8;border:0;border-radius:.5em}p{line-height:1.5}summary{padding:1em 0}small{color:#bcc}</style>
<button type=button id=lang>中文 / English</button><h2 data-t=title></h2>
<p id=connection role=status></p><button type=button id=scan data-t=scan></button><p id=status role=status></p><label data-t=nearby for=networks></label><select id=networks><option value='' data-t=choose></option></select>
<form method=post action=/wifi id=form><label for=ssid data-t=ssid></label><input id=ssid name=ssid maxlength=32 required autocomplete=off><label for=password data-t=password></label><input id=password name=password type=password maxlength=63 autocomplete=off><label><input id=show type=checkbox style='width:auto'><span data-t=show></span></label><label><input id=phoneHotspot type=checkbox style="width:auto"><span data-t=phoneHotspot></span></label><p data-t=hotspotHelp></p><button data-t=save></button></form>
<h3 data-t=saved></h3><button id=refresh type=button data-t=refresh></button><p id=savedStatus role=status></p><div id=saved></div><details><summary data-t=import></summary><p data-t=help></p><textarea id=shared rows=3 placeholder='WIFI:T:WPA;S:My Wi-Fi;P:password;;' autocomplete=off></textarea><button type=button id=import data-t=apply></button><p id=importStatus role=status></p></details><p><small data-t=privacy></small></p>
<script>
const texts={en:{title:'Connect Passport OS',phoneHotspot:'Connect to this phone’s hotspot',hotspotHelp:'Enter your phone hotspot name/password manually. After saving, Passport closes its setup Wi-Fi so you can enable Personal Hotspot. On iPhone enable Allow Others to Join and Maximize Compatibility (2.4 GHz).',hotspotSaved:'Saved. Now enable your phone hotspot; Passport is waiting to connect.',connect:'Connect',connecting:'Connecting to the selected Wi-Fi…',connected:'Wi-Fi connected. Setup complete.',failed:'Could not connect the selected Wi-Fi. Check the password and retry.',saved:'Saved networks',refresh:'Refresh saved networks',forget:'Forget',confirm:'Forget this network?',saveError:'Could not save: list full (8) or invalid request. Forget a network and retry.',storageError:'Could not save network settings. Existing networks were retained.',fallback:'Could not connect the requested network; another saved network is connected.',pending:'Request received. Refresh to check the saved list.',scan:'Scan nearby Wi-Fi',nearby:'Nearby networks (2.4 GHz)',choose:'Select or type a name below',ssid:'Wi-Fi name (SSID)',password:'Password',show:'Show password',save:'Save and connect',import:'Import shared Wi-Fi text',help:'This page cannot read saved networks on your phone. On iPhone, open Passwords → Wi-Fi to copy a saved password, then paste it above. If you have shared WIFI: QR code text, paste it below. QR images and automatic iPhone password sharing are not supported.',apply:'Fill from shared text',privacy:'Credentials go only to this device. Nothing is sent to an external service.',scanning:'Scanning…',found:'Choose a network or enter a hidden network manually.',empty:'No networks found. Try again or enter the name manually.',busy:'Scan unavailable while connecting. Wait and retry, or enter the name manually.',bad:'Invalid or unsupported Wi-Fi text. Use WIFI:T:WPA;S:name;P:password;; (or nopass).',filled:'Filled. Check the details and tap Save and connect.',invalid:'SSID must be 1–32 UTF-8 bytes; password must be empty or 8–63 bytes.'},zh:{title:'连接 Passport OS',phoneHotspot:'连接这台手机的热点',hotspotHelp:'手动填写本机热点名称/密码。保存后设备会关闭配网 Wi-Fi，您再打开个人热点。iPhone 请开启“允许他人加入”和“最大兼容性”（2.4 GHz）。',hotspotSaved:'已保存，请打开手机热点，设备正在等待连接。',connect:'连接',connecting:'正在连接所选 Wi-Fi…',connected:'Wi-Fi 连接成功，配网完成。',failed:'未能连接所选 Wi-Fi，请核对密码后重试。',saved:'已保存网络',refresh:'刷新已保存网络',forget:'忘记网络',confirm:'确认忘记此网络？',saveError:'保存失败：列表已满（8 个）或请求无效，请先忘记网络后重试。',storageError:'网络配置保存失败，原有网络已保留。',fallback:'未能连接指定网络，已连接其他保存网络。',pending:'请求已提交，请刷新确认已保存列表。',scan:'扫描附近 Wi-Fi',nearby:'附近网络（2.4 GHz）',choose:'选择网络，或在下方手动输入',ssid:'Wi-Fi 名称（SSID）',password:'密码',show:'显示密码',save:'保存并连接',import:'导入 Wi-Fi 分享文本',help:'网页不能读取手机已保存的网络。iPhone 可打开“密码 → Wi-Fi”，复制已保存密码后粘贴到上方。如有分享二维码的 WIFI: 文本，可粘贴到下方。不支持二维码图片识别或 iPhone 自动共享密码。',apply:'从分享文本填入',privacy:'凭据只提交给此设备，不发送至外部服务。',scanning:'正在扫描…',found:'请选择网络，也可手动输入隐藏网络名称。',empty:'未发现网络，可重新扫描或手动输入。',busy:'连接过程中暂时无法扫描，请稍后重试或手动输入。',bad:'分享文本格式无效或不受支持，请使用 WIFI:T:WPA;S:名称;P:密码;; 或 nopass。',filled:'已填入，请核对后点击“保存并连接”。',invalid:'名称须为 1–32 个 UTF-8 字节，密码须为空或 8–63 字节。'}};
let language=navigator.language.toLowerCase().startsWith('zh')?'zh':'en';const el=id=>document.getElementById(id);const t=key=>texts[language][key];
function translate(){document.documentElement.lang=language;document.querySelectorAll('[data-t]').forEach(n=>n.textContent=t(n.dataset.t));}translate();
el('lang').onclick=()=>{language=language==='zh'?'en':'zh';translate();};
function valid(ssid,password){const enc=new TextEncoder();const n=enc.encode(ssid).length,p=enc.encode(password).length;return n>0&&n<=32&&(p===0||(p>=8&&p<=63));}
function parseShared(raw){if(raw.length>512||!raw.startsWith('WIFI:'))return null;const fields={};let part='',escaped=false;const parts=[];for(const c of raw.slice(5)){if(escaped){part+=c;escaped=false;}else if(c==='\\')escaped=true;else if(c===';'){parts.push(part);part='';}else part+=c;}if(escaped||part)return null;for(const value of parts){if(!value)continue;const i=value.indexOf(':');if(i<1)return null;const k=value.slice(0,i);if(Object.prototype.hasOwnProperty.call(fields,k))return null;fields[k]=value.slice(i+1);}if(fields.T!=='WPA'&&fields.T!=='nopass')return null;const ssid=fields.S||'',password=fields.T==='nopass'?'':fields.P||'';return valid(ssid,password)?{ssid,password}:null;}
el('import').onclick=()=>{const data=parseShared(el('shared').value.trim());el('importStatus').textContent=t(data?'filled':'bad');if(data){el('ssid').value=data.ssid;el('password').value=data.password;el('shared').value='';}};
el('show').onchange=()=>el('password').type=el('show').checked?'text':'password';
el('form').onsubmit=async e=>{e.preventDefault();if(!valid(el('ssid').value,el('password').value)){el('status').textContent=t('invalid');return;}try{const r=await fetch(el('phoneHotspot').checked?'/hotspot':'/wifi',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded','X-Passport-Setup':'1'},body:new URLSearchParams({ssid:el('ssid').value,password:el('password').value})});if(!r.ok)throw Error();el('password').value='';el('status').textContent=t('pending');setTimeout(loadSaved,1000);}catch{el('status').textContent=t('busy');}};
el('networks').onchange=()=>{if(el('networks').selectedIndex>0){el('ssid').value=el('networks').value;el('password').value='';el('password').focus();}};
el('scan').onclick=async()=>{el('scan').disabled=true;el('status').textContent=t('scanning');try{const response=await fetch('/scan',{cache:'no-store'});if(!response.ok)throw Error();const rows=await response.json();el('networks').length=1;for(const row of rows){const option=document.createElement('option');option.value=row.ssid;option.textContent=row.ssid+' · '+row.rssi+' dBm'+(row.secure?' 🔒':'');el('networks').appendChild(option);}el('status').textContent=t(rows.length?'found':'empty');}catch{el('status').textContent=t('busy');}finally{el('scan').disabled=!!el('phoneHotspot').checked;}};
async function loadSaved(){try{const r=await fetch('/saved',{cache:'no-store'});if(!r.ok)throw Error();const data=await r.json();el('saved').textContent='';for(const name of data.networks){const row=document.createElement('div'),label=document.createElement('span'),button=document.createElement('button');label.textContent=name;button.type='button';button.dataset.t='forget';button.textContent=t('forget');button.onclick=async()=>{if(!confirm(t('confirm')+' '+name))return;button.disabled=true;try{const r=await fetch('/forget',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded','X-Passport-Setup':'1'},body:new URLSearchParams({ssid:name,password:''})});if(!r.ok)throw Error();el('savedStatus').textContent=t('pending');setTimeout(loadSaved,1000);}catch{button.disabled=false;el('savedStatus').textContent=t('busy');}};const use=document.createElement('button');use.type='button';use.dataset.t='connect';use.textContent=t('connect');use.onclick=async()=>{use.disabled=true;try{const r=await fetch(el('phoneHotspot').checked?'/connect-hotspot':'/connect',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded','X-Passport-Setup':'1'},body:new URLSearchParams({ssid:name,password:''})});if(!r.ok)throw Error();el('connection').textContent=t('connecting');}catch{el('connection').textContent=t('failed');use.disabled=false;}};row.appendChild(label);row.appendChild(button);row.appendChild(use);el('saved').appendChild(row);}el('savedStatus').textContent=data.status?t(data.status===1?'saveError':data.status===3?'pending':data.status===4?'fallback':'storageError'):data.networks.length+' / '+data.capacity;}catch{el('savedStatus').textContent=t('busy');}}
el('refresh').onclick=loadSaved;
el('phoneHotspot').onchange=()=>{el('scan').disabled=el('phoneHotspot').checked;el('networks').disabled=el('phoneHotspot').checked;};
async function pollConnection(){let complete=false;try{const r=await fetch('/status',{cache:'no-store'});if(r.ok){const data=await r.json();el('connection').textContent=data.deferred&&data.stored?t('hotspotSaved'):data.state==='waiting'?'':t(data.state==='connected'?'connected':data.state==='failed'?(data.error===1?'saveError':data.error===2?'storageError':data.error===4?'fallback':'failed'):'connecting');complete=data.state==='connected'||(data.deferred&&data.stored);}}catch{}if(!complete)setTimeout(pollConnection,700);}
el('scan').click();loadSaved();pollConnection();
</script></html>
