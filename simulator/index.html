<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Passport OS Developer Simulator</title>
<style>body{margin:0;background:#edf1f7;color:#142237;font:16px system-ui;display:grid;place-content:center;min-height:100vh}main{display:flex;gap:40px;align-items:center;max-width:900px;padding:32px}.device{background:#172434;padding:20px;border-radius:40px;box-shadow:0 20px 45px #14223733}canvas{border-radius:30px;background:#101a29;display:block}.keys{display:flex;justify-content:space-around;margin-top:14px}button,select,input{font:inherit;padding:10px;border:1px solid #9aabbd;border-radius:10px;cursor:pointer}button{background:#fff}aside{max-width:380px}code{font-size:14px}pre{white-space:pre-wrap;background:#fff;padding:14px;border-radius:12px}h1{font-size:27px}small{color:#586b80}@media(max-width:650px){main{flex-direction:column}}</style>
<main><div class="device"><canvas id="screen" width="240" height="320"></canvas><div class="keys"><button data-key="0">UP</button><button data-key="2">OK</button><button data-key="1">DOWN</button></div></div><aside><h1>Passport OS</h1><p>Developer simulator · API 1</p><select id="apps"></select> <button id="launch">Launch</button><p><button id="stop">Exit</button> <button id="grant">Allow mic</button></p><p>Mock audio RMS <input id="audio" type="range" min="0" max="100" value="0"></p><pre id="metrics"></pre><small>Runs the firmware's C runtime and bounded Lua VM on this Mac. Display/font/timing differ from hardware. Network/audio are fixtures, not device acceptance.</small></aside></main>
<script>let running=false,busy=false;const c=document.querySelector('canvas'),g=c.getContext('2d');async function request(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});return r.json()}
let imageCache={};function paint(v){g.fillStyle='#101a29';g.fillRect(0,0,240,320);g.fillStyle='#e9f0fa';g.font='14px monospace';g.fillText('SIMULATOR   API 1',22,28);g.font='15px monospace';let y=60;for(const line of (v.error||v.text||'Select an app').split('\n')){g.fillText(line,18,y,205);y+=20}for(const d of v.draw||[]){g.fillStyle='#'+d[4].toString(16).padStart(6,'0');g.fillRect(12+d[0],110+d[1],d[2],d[3])}for(const d of v.images||[]){if(d.system){g.fillStyle='#'+d.color.toString(16).padStart(6,'0');g.font=d.size+'px sans-serif';const symbols={'system.wifi':'◉','system.battery':'▰','system.settings':'⚙','system.cloud':'☁','system.chat':'▣','system.back':'←','system.app-default':'▧'};g.fillText(symbols[d.id]||'◆',12+d.x,110+d.y+d.size)}else{const key=d.id;if(!imageCache[key]){let im=new Image();im.src='/asset/'+encodeURIComponent(key);imageCache[key]=im}const im=imageCache[key];if(im.complete)g.drawImage(im,12+d.x,110+d.y)}}g.fillStyle=v.microphone?'#ffb45c':'#91a9c8';g.font='12px monospace';g.fillText(v.microphone?'MIC ON · local only':'UP / DOWN / OK',20,304);document.querySelector('#metrics').textContent=`Lua heap: ${v.heap||0} B\nPeak: ${v.peak||0} / 32768 B\n${v.error||'Status: running'}`}
async function event(name,value=0){if(!running||busy)return;busy=true;try{paint(await request('/event',{name,value}))}finally{busy=false}}
request('/apps').then(j=>{for(const a of j.apps){const o=document.createElement('option');o.value=a;o.textContent=a;document.querySelector('#apps').append(o)}});document.querySelector('#launch').onclick=async()=>{imageCache={};paint(await request('/launch',{app:document.querySelector('#apps').value}));running=true};document.querySelector('#stop').onclick=async()=>{running=false;await request('/stop',{});paint({text:'Passport OS\nApp stopped; data kept'})};document.querySelector('#grant').onclick=()=>event('permission',1);document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>event('on_button',+b.dataset.key));document.addEventListener('keydown',e=>{const k={ArrowLeft:0,ArrowUp:0,ArrowRight:1,ArrowDown:1,Enter:2}[e.key];if(k!==undefined){e.preventDefault();event('on_button',k)}});setInterval(()=>event('on_tick',50),50);document.querySelector('#audio').oninput=e=>event('on_audio',+e.target.value);paint({text:'Passport OS\nSelect a signed app'});</script></html>
